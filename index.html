<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F9CBDA">
<meta name="robots" content="noindex">
<title>Sổ Huyền Cake</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23B8235A'/%3E%3Cpath d='M8 23v-7h16v7zM11 16v-4h10v4M16 12V8' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Pacifico&display=swap">
<style>
/* Layout: phone-first ledger. A frosting-pink band with a piped scallop edge on top, one column of order tickets and entry rows below, tab bar at the thumb on phones and under the band on desktop. */
:root{
  --bg:#FFF7F9; --surface:#FFFFFF; --sunken:#FBEBF0; --band:#F9CBDA; --band-ink:#4A1230;
  --ink:#34172A; --muted:#75566A; --line:#EFD9E1;
  --accent:#B8235A; --on-accent:#FFFFFF; --leaf:#1F6B4B; --leaf-soft:#DDF1E7;
  --warn:#8A5A00; --warn-soft:#FCEFCF; --bad:#B3261E; --bad-soft:#FBE3E1; --info:#1B5F8F; --info-soft:#DDEDF8;
  --c1:#B8235A; --c2:#1578BE;
  --display:"Pacifico","Be Vietnam Pro",cursive;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C1017; --surface:#291822; --sunken:#34202C; --band:#5A1E3A; --band-ink:#FFE3EE;
  --ink:#FBEFF4; --muted:#C4A9B8; --line:#4A2F3D;
  --accent:#F27DA6; --on-accent:#3A0C20; --leaf:#7AD3AB; --leaf-soft:#1E3A2D;
  --warn:#F2C76B; --warn-soft:#42320F; --bad:#FFA69E; --bad-soft:#4A1F1C; --info:#8CC8F0; --info-soft:#17344A;
  --c1:#E4558A; --c2:#3A9BE0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1017; --surface:#291822; --sunken:#34202C; --band:#5A1E3A; --band-ink:#FFE3EE;
  --ink:#FBEFF4; --muted:#C4A9B8; --line:#4A2F3D;
  --accent:#F27DA6; --on-accent:#3A0C20; --leaf:#7AD3AB; --leaf-soft:#1E3A2D;
  --warn:#F2C76B; --warn-soft:#42320F; --bad:#FFA69E; --bad-soft:#4A1F1C; --info:#8CC8F0; --info-soft:#17344A;
  --c1:#E4558A; --c2:#3A9BE0; color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body);-webkit-text-size-adjust:100%}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}

/* band */
.band{background:var(--band);color:var(--band-ink);position:relative;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 12px;margin-bottom:22px}
.band::after{content:"";position:absolute;left:0;right:0;bottom:-11px;height:12px;background:radial-gradient(circle at 12px 0,var(--band) 11.5px,transparent 12px) 0 0/24px 12px repeat-x}
.band-in{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:25px;line-height:1.3;font-weight:400}
.who{margin-left:auto}
.who[hidden]+.sync{margin-left:auto}
.sync{font-size:12.5px;display:flex;align-items:center;gap:6px;min-width:0}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--leaf);flex:none}
.sync.busy i{background:var(--warn)} .sync.off i{background:var(--bad)}

/* nav */
.tabs{display:flex;gap:2px;width:100%}
.tabs a{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:8px 10px;border-radius:10px;color:inherit;text-decoration:none;font-weight:500;font-size:14px;white-space:nowrap}
.tabs a[aria-current="page"]{background:var(--surface);color:var(--accent);font-weight:600}
.tabs svg{width:18px;height:18px;flex:none}
@media (max-width:759px){
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:4px max(4px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px));color:var(--muted)}
  .tabs a{flex-direction:column;gap:1px;font-size:11px;padding:5px 0;min-width:0}
  .tabs svg{width:21px;height:21px}
  .tabs a[aria-current="page"]{background:var(--sunken)}
  main{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))!important}
  .fab-space{padding-bottom:64px}
}
main{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 48px;display:flex;flex-direction:column;gap:20px}
.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.head h1{font-size:22px;font-weight:700;line-height:1.25;text-wrap:balance;margin-right:auto}
h2{font-size:15.5px;font-weight:700;line-height:1.3}
section{display:flex;flex-direction:column;gap:10px;min-width:0}
.sec-head{display:flex;align-items:baseline;gap:10px;justify-content:space-between;flex-wrap:wrap}

/* controls */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{min-height:34px;padding:5px 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.btn[disabled]{opacity:.5;cursor:default}
.linkish{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-align:left;text-decoration:underline;text-underline-offset:3px}
.switch{display:inline-flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.switch button{background:none;border:0;width:40px;height:40px;font-size:20px;line-height:1;color:var(--accent);border-radius:9px}
.switch button[disabled]{opacity:.3;cursor:default}
.switch b{min-width:112px;text-align:center;font-weight:600;font-size:14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:500;white-space:nowrap;min-height:34px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;min-width:0}
.input,label.f input,label.f select,label.f textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;min-height:44px;font-weight:400;font-size:16px;min-width:0}
label.f textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:13px;color:var(--muted);font-weight:400}
.check{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;min-height:36px}
.check input{width:20px;height:20px;accent-color:var(--accent)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.stat span{display:block;font-size:13px;color:var(--muted)}
.stat b{display:block;font-size:21px;font-weight:700;line-height:1.3;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat.hero{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.stat.hero span{color:inherit}
@media (max-width:520px){.stats{grid-template-columns:1fr 1fr}.stats .stat.hero{grid-column:1/-1;order:-1}}

/* tickets */
.list{display:flex;flex-direction:column;gap:8px}
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;grid-template-columns:62px 1fr;overflow:hidden}
.ticket .when{background:var(--sunken);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 2px;border-right:1px dashed var(--line);text-align:center}
.ticket .when b{font-size:16px;font-variant-numeric:tabular-nums;line-height:1.2}
.ticket .when span{font-size:11.5px;color:var(--muted)}
.ticket .body{padding:10px 12px;min-width:0;display:flex;flex-direction:column;gap:5px}
.ticket.done{opacity:.72}
.tline{display:flex;gap:8px;justify-content:space-between;align-items:baseline}
.tname{font-weight:600;background:none;border:0;padding:0;text-align:left;overflow-wrap:anywhere}
.tname:hover{color:var(--accent)}
.tdesc{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.tact{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.moi{background:var(--warn-soft);color:var(--warn)}
.pill.dang{background:var(--info-soft);color:var(--info)}
.pill.xong{background:var(--leaf-soft);color:var(--leaf)}
.pill.huy{background:var(--sunken);color:var(--muted)}
.pill.late{background:var(--bad-soft);color:var(--bad)}
.day-h{font-size:13px;font-weight:700;color:var(--muted);padding-top:6px}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:500}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}

/* rows */
.rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line);min-height:50px;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.row:first-child{border-top:0}
button.row:hover{background:var(--sunken)}
.row .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.row .amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .sub{display:block;font-size:12.5px;color:var(--muted)}
.row.off{opacity:.55}
.stepper{display:inline-flex;align-items:center;flex:none;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{width:40px;height:42px;border:0;background:var(--sunken);font-size:20px;line-height:1;color:var(--accent);font-weight:600}
.stepper input{width:46px;height:42px;border:0;background:none;text-align:center;font-size:16px;font-variant-numeric:tabular-nums;font-weight:600;-moz-appearance:textfield;padding:0}
.stepper input::-webkit-inner-spin-button{appearance:none}
.sticky-total{position:sticky;bottom:0;z-index:5;background:var(--ink);color:var(--bg);border-radius:var(--r);padding:11px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600}
.sticky-total b{font-size:19px;font-variant-numeric:tabular-nums}
@media (max-width:759px){.sticky-total{bottom:calc(66px + env(safe-area-inset-bottom,0px))}}

/* table + chart */
.tscroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:right;border-top:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
thead th{border-top:0;font-size:12.5px;color:var(--muted);font-weight:600}
th:first-child,td:first-child{text-align:left;font-weight:500}
tr.total td{font-weight:700;background:var(--sunken)}
tr[data-act]{cursor:pointer}
tr.sel td{background:var(--sunken)}
.neg{color:var(--bad)}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 8px;position:relative}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chart svg{display:block;width:100%;height:auto}
.chart svg text{fill:var(--muted);font:11px var(--body)}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:hover{fill:var(--sunken);fill-opacity:.7}
.chart .gridl{stroke:var(--line);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;border-radius:8px;padding:6px 9px;white-space:nowrap;z-index:3;font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:759px){.two{grid-template-columns:1fr}}

/* sheet */
dialog{border:0;padding:0;background:var(--bg);color:var(--ink);border-radius:16px;width:min(560px,calc(100vw - 32px));max-height:calc(100dvh - 48px);overflow:hidden}
dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:rgba(30,10,22,.55)}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 8px}
.sh-head h2{font-size:18px}
.sh-x{background:none;border:0;font-size:24px;line-height:1;width:40px;height:40px;color:var(--muted)}
.sh-body{padding:6px 16px 14px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;min-height:0}
.sh-body>*{flex-shrink:0}
.sh-foot{padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface)}
.sh-foot .sum{margin-right:auto;font-size:13px;color:var(--muted);line-height:1.3}
.sh-foot .sum b{display:block;color:var(--ink);font-size:17px;font-variant-numeric:tabular-nums}
.err{color:var(--bad);font-size:14px;font-weight:500;width:100%}
.lineitem{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px}
.li3{display:grid;grid-template-columns:72px 1fr auto;gap:8px;align-items:end}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;border:0;background:none;padding:9px 6px;font-weight:500;min-height:42px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
@media (max-width:520px){
  th,td{padding:9px 7px;font-size:13px}
  dialog{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:16px 16px 0 0;max-height:92dvh}
}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));width:max-content;z-index:50;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;font-weight:500;max-width:calc(100vw - 32px)}
.who{display:flex;align-items:center;gap:8px;font-size:12.5px}
.who button{background:none;border:0;padding:4px 2px;color:inherit;text-decoration:underline;text-underline-offset:3px;font-size:12.5px}
.login{max-width:380px;margin:24px auto;display:flex;flex-direction:column;gap:14px;text-align:center;align-items:stretch}
.login h1{font-size:22px;font-weight:700;line-height:1.3}
</style>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<body>

<header class="band">
  <div class="band-in">
    <div class="brand">Huyền Cake</div>
    <div class="who" id="who" hidden></div><div class="sync busy" id="sync" role="status"><i></i><span>Đang tải…</span></div>
    <nav class="tabs" id="tabs" aria-label="Các mục chính"></nav>
  </div>
</header>
<main id="view"><div class="empty">Đang mở sổ của tiệm…</div></main>
<dialog id="sheet" aria-labelledby="sheet-title"></dialog>
<div id="toast" role="status" hidden></div>

<script>
/*CORE*/
const START='2027-01-01', START_YM='2027-01';
const money=n=>Math.round(n||0).toLocaleString('vi-VN').replace(/,/g,'.')+' đ';
const parseMoney=s=>{const d=String(s??'').replace(/\D/g,'');return d?Number(d):0};
const fmtInput=n=>n?Number(n).toLocaleString('vi-VN').replace(/,/g,'.'):'';
const ymOf=d=>d.slice(0,7);
const shiftYm=(ym,k)=>{const[y,m]=ym.split('-').map(Number);const t=y*12+m-1+k;return Math.floor(t/12)+'-'+String(t%12+1).padStart(2,'0')};
const shiftDay=(d,k)=>{const t=new Date(d+'T00:00:00Z');t.setUTCDate(t.getUTCDate()+k);return t.toISOString().slice(0,10)};
const dm=d=>d.slice(8,10)+'/'+d.slice(5,7);
const dmy=d=>dm(d)+'/'+d.slice(0,4);
const wd=d=>['CN','T2','T3','T4','T5','T6','T7'][new Date(d+'T00:00:00Z').getUTCDay()];

/* Giá hiệu lực tại một ngày: mốc gần nhất có from <= ngày đó; ngày trước mốc đầu tiên dùng giá đầu tiên. */
function priceAt(p,date){
  const list=[...(p?.prices||[])].sort((a,b)=>a.from<b.from?-1:1);
  if(!list.length)return 0;
  let cur=list[0];
  for(const e of list)if(e.from<=date)cur=e;
  return cur.price;
}
/* Chia tiền một dòng cho bánh và hoa. Combo chia theo % phần hoa. */
function split(amount,group,hoaPct){
  if(group==='hoa')return{banh:0,hoa:amount};
  if(group==='combo'){const hoa=Math.round(amount*(hoaPct??50)/100);return{banh:amount-hoa,hoa}}
  return{banh:amount,hoa:0};
}
const orderTotal=o=>(o.lines||[]).reduce((s,l)=>s+(l.qty||0)*(l.price||0),0);
const orderLeft=o=>o.paidFull?0:Math.max(0,orderTotal(o)-(o.deposit||0));
function retailTotal(doc,products,date){
  let t=(doc?.otherBanh||0)+(doc?.otherHoa||0);
  for(const[pid,q]of Object.entries(doc?.items||{}))t+=(q||0)*priceAt(products[pid],date);
  return t;
}
/* Tổng hợp các tháng. Doanh thu đơn đặt được tính khi đơn ở trạng thái Đã giao, theo ngày giao. */
function summarize(months,products,sources,from='0000',to='9999'){
  const s={rev:{banh:0,hoa:0},cost:{banh:0,hoa:0,chung:0},retail:0,orders:0,pending:0,pendingCount:0,doneCount:0,byItem:{},bySource:{},customers:{}};
  const add=(name,qty,amt,group,pct)=>{const x=split(amt,group,pct);s.rev.banh+=x.banh;s.rev.hoa+=x.hoa;const b=s.byItem[name]||(s.byItem[name]={qty:0,amt:0});b.qty+=qty;b.amt+=amt};
  const inR=d=>d>=from&&d<=to;
  for(const m of months){
    for(const[date,doc]of Object.entries(m.retail||{})){
      if(!inR(date))continue;
      for(const[pid,q]of Object.entries(doc.items||{})){
        if(!q)continue;const p=products[pid];const amt=q*priceAt(p,date);
        add(p?.name||'Sản phẩm đã xóa',q,amt,p?.group||'banh',p?.hoaPct);s.retail+=amt;
      }
      if(doc.otherBanh){add('Bán khác (bánh)',0,doc.otherBanh,'banh');s.retail+=doc.otherBanh}
      if(doc.otherHoa){add('Bán khác (hoa)',0,doc.otherHoa,'hoa');s.retail+=doc.otherHoa}
    }
    for(const o of Object.values(m.orders||{})){
      if(!inR(o.date)||o.status==='huy')continue;
      const t=orderTotal(o);
      if(o.status==='xong'){
        s.orders+=t;s.doneCount++;
        for(const l of o.lines||[])add(l.name||'Đơn tự ghi',l.qty||0,(l.qty||0)*(l.price||0),l.group||'banh',l.hoaPct);
        const k=(o.customer||'').trim();
        if(k){const c=s.customers[k]||(s.customers[k]={n:0,amt:0,contact:o.contact||''});c.n++;c.amt+=t}
      }else{s.pending+=t;s.pendingCount++}
    }
    for(const e of Object.values(m.purchases||{})){
      if(!inR(e.date))continue;
      const src=sources[e.sourceId];const g=src?.group||'chung';
      s.cost[g]+=e.amount||0;
      const n=src?.name||'Nguồn đã xóa';s.bySource[n]=(s.bySource[n]||0)+(e.amount||0);
    }
  }
  s.revTotal=s.rev.banh+s.rev.hoa;
  s.costTotal=s.cost.banh+s.cost.hoa+s.cost.chung;
  s.profit=s.revTotal-s.costTotal;
  return s;
}
/*END*/

  for(const k of['otherBanh','otherHoa','note'])if(k in patch)dr[k]=patch[k];

async function flushRetail(){
  if(saving){clearTimeout(saveT);saveT=setTimeout(flushRetail,400);return}
  const dates=Object.keys(drafts);if(!dates.length)return;
  saving=true;
  for(const date of dates){
    const dr=drafts[date];delete drafts[date];
    const ym=ymOf(date),ref=db.collection('m/'+ym+'/retail').doc(date),had=!!data(ym).retail[date];
    try{await write(()=>had?ref.update(stamp(dr)):ref.set(stamp({items:{},otherBanh:0,otherHoa:0,note:'',...dr})));
      data(ym).retail[date]={...(data(ym).retail[date]||{}),...dr,items:{...(data(ym).retail[date]?.items||{}),...(dr.items||{})}};}
    catch(e){drafts[date]={...dr,...(drafts[date]||{})};toast(dbFail(e));setSync('off','Chưa lưu được');saving=false;schedule();return}
  }
  saving=false;setSync('',readOnly?'Chỉ xem':'Đã đồng bộ');
}

const fetched={};
async function loadYear(){
  state.yearReady=false;schedule();
  const y=state.repYear,yms=Array.from({length:12},(_,i)=>y+'-'+pad(i+1));
  try{
    const need=yms.filter(ym=>!watching[ym]&&Date.now()-(fetched[ym]||0)>600000);
    await Promise.all(need.flatMap(ym=>KINDS.map(async k=>{
      const snap=await db.collection('m/'+ym+'/'+k).get();
      data(ym)[k]=Object.fromEntries(snap.docs.map(x=>[x.id,x.data()]));
    })));
    for(const ym of need)fetched[ym]=Date.now();
    if(y===state.repYear){state.yearReady=true;schedule()}
  }catch(e){toast('Chưa tải được báo cáo. Hãy mở lại mục này.')}
}

  if(!state.yearReady)return head+'<div class="empty">Đang cộng số liệu cả năm…</div>';
  const cat=[P.products,P.sources];

function niceMax(v){if(v<=0)return 1e6;const e=10**Math.floor(Math.log10(v));for(const k of[1,2,2.5,5,10])if(k*e>=v)return k*e;return 10*e}
function chart(months){
  const W=innerWidth<520?380:720,H=230,L=46,B=24,T=8,max=niceMax(Math.max(...months.flatMap(m=>[m.s.revTotal,m.s.costTotal])));
  const ph=H-B-T,step=(W-L)/12,bw=Math.min(16,step/2-3),y=v=>T+ph-(v/max)*ph;
  const lbl=v=>v===0?'0':v>=1e6?(v/1e6).toLocaleString('vi-VN')+' tr':(v/1e3)+'k';
  let g='';for(const k of[0,.5,1]){const v=max*k;g+=`<line class="gridl" x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${lbl(v)}</text>`}
  const bar=(x,v,c)=>{if(v<=0)return'';const h=Math.max(2,(v/max)*ph);const r=Math.min(4,h);return`<path d="M${x} ${T+ph}V${T+ph-h+r}q0-${r} ${r}-${r}h${bw-2*r}q${r} 0 ${r} ${r}V${T+ph}z" fill="var(${c})"/>`};
  const bars=months.map((m,i)=>{const cx=L+step*i+step/2;
    return`${bar(cx-bw-1,m.s.revTotal,'--c1')}${bar(cx+1,m.s.costTotal,'--c2')}<text x="${cx}" y="${H-7}" text-anchor="middle">T${m.i}</text>
    <rect class="hit" x="${L+step*i}" y="${T}" width="${step}" height="${ph+B-2}" data-i="${m.i}" data-rev="${m.s.revTotal}" data-cost="${m.s.costTotal}" data-act="rm" data-k="${m.i}"/>`}).join('');
  return`<div class="chart" id="chart"><div class="legend"><span><i style="background:var(--c1)"></i>Doanh thu</span><span><i style="background:var(--c2)"></i>Tiền nhập</span></div>
   <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ doanh thu và tiền nhập 12 tháng. Số liệu có trong bảng từng tháng bên dưới.">${g}${bars}</svg><div class="tip" id="tip" hidden></div></div>`;
}
function bindChart(){
  const c=$('chart');if(!c)return;const tip=$('tip');
  c.querySelectorAll('.hit').forEach(r=>{
    r.addEventListener('pointerenter',()=>{
      tip.innerHTML=`Tháng ${r.dataset.i}<br>Doanh thu ${money(+r.dataset.rev)}<br>Tiền nhập ${money(+r.dataset.cost)}`;tip.hidden=false;
      const b=r.getBoundingClientRect(),w=c.getBoundingClientRect();
      tip.style.left=Math.min(w.width-tip.offsetWidth-6,Math.max(6,b.left-w.left+b.width/2-tip.offsetWidth/2))+'px';tip.style.top='34px';
    });
    r.addEventListener('pointerleave',()=>tip.hidden=true);
  });
}

function takePrice(){
  const pr=parseMoney($('n-price').value),from=$('n-from').value;
  if(!pr)return false;if(!from){sheetErr('Hãy chọn ngày áp dụng.');return null}
  sd.prices=sd.prices.filter(e=>e.from!==from);sd.prices.push({from,price:pr});
  $('n-price').value='';return true;
}
async function saveProduct(btn){
  if(!sd.name.trim())return sheetErr('Hãy nhập tên sản phẩm.');
  if(takePrice()===null)return;
  if(!sd.prices.length)return sheetErr('Hãy nhập giá bán.');
  const{id,...rest}=sd,col=db.collection('products'),ref=id?col.doc(id):col.doc();
  const ok=await saving2(btn,()=>ref.set(stamp({...rest,name:rest.name.trim(),cat:(rest.cat||'').trim()||GROUP[rest.group]})));
  if(!ok)return;closeSheet();toast('Đã lưu '+sd.name.trim());
}

/* xuất file */
async function exportCsv(){
  const y=state.repYear,q=v=>{const s=String(v??'');return /[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const rows=[['Loại','Ngày','Tên','Nhóm','Số lượng','Đơn giá','Thành tiền','Trạng thái','Khách','Ghi chú']];
  for(let i=1;i<=12;i++){
    const m=data(y+'-'+pad(i));
    for(const[d,doc]of Object.entries(m.retail).sort()){
      for(const[pid,qty]of Object.entries(doc.items||{})){if(!qty)continue;const p=P.products[pid],pr=priceAt(p,d);rows.push(['Bán lẻ',d,p?.name||'',GROUP[p?.group]||'',qty,pr,qty*pr,'','',''])}
      if(doc.otherBanh)rows.push(['Bán lẻ',d,'Bán khác','Bánh','','',doc.otherBanh,'','','']);
      if(doc.otherHoa)rows.push(['Bán lẻ',d,'Bán khác','Hoa','','',doc.otherHoa,'','','']);
    }
    for(const o of Object.values(m.orders))for(const l of o.lines||[])rows.push(['Đơn đặt',o.date,l.name,GROUP[l.group]||'',l.qty,l.price,l.qty*l.price,STATUS[o.status],o.customer||'',l.note||'']);
    for(const e of Object.values(m.purchases)){const s=P.sources[e.sourceId];rows.push(['Nhập hàng',e.date,s?.name||'',COST[s?.group]||'','','',e.amount,'','',e.note||''])}
  }
  try{await dl.save({filename:`huyen-cake-${y}.csv`,data:'﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n')});toast('Đã tải file')}
  catch(e){if(e?.code!=='declined')toast('Chưa tải được file.')}
}

   case'ship':od.ship=k==='1';b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));$('addr').hidden=!od.ship;break;
   case'addline':od.lines.push({pid:'',name:'',note:'',qty:1,price:0,group:'banh'});$('lines').innerHTML=linesHtml();odSum();break;

   case'addprice':{const r=takePrice();if(r===false)sheetErr('Hãy nhập giá mới.');else if(r){$('plist').innerHTML=pricesHtml();sheetErr('')}break}
   case'rmprice':sd.prices=sd.prices.filter(e=>e.from!==k);$('plist').innerHTML=pricesHtml();break;

     if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Bấm lần nữa để xóa';break}
     const ok=await saving2(b,()=>b.dataset.then==='delorder'?db.collection('m/'+od.oldYm+'/orders').doc(od.id).delete():db.collection('m/'+pd.oldYm+'/purchases').doc(pd.id).delete());
     if(ok){closeSheet();toast('Đã xóa')}break}
  }
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.hasAttribute('data-money')){t.value=fmtInput(parseMoney(t.value))}
  if(t.id==='q'){state.q=t.value;$('olist').innerHTML=orderListHtml();return}
  const val=t.type==='checkbox'?t.checked:t.hasAttribute('data-money')?parseMoney(t.value):t.value;
  if(t.dataset.o){
    od[t.dataset.o]=val;
    if(t.dataset.o==='date'&&val){for(const l of od.lines)if(l.pid&&!l.manual)l.price=priceAt(P.products[l.pid],val);$('lines').innerHTML=linesHtml()}
    odSum();
  }else if(t.dataset.lf){
    const l=od.lines[+t.dataset.l],f=t.dataset.lf;
    if(f==='qty')l.qty=Number(t.value)||0;
    else if(f==='price'){l.price=val;l.manual=true}
    else if(f==='pid'){
      const p=P.products[val];l.pid=val;l.manual=false;
      if(p){l.name=p.name;l.group=p.group;l.hoaPct=p.hoaPct;l.price=priceAt(p,od.date)}else{l.name='';l.price=0;l.group='banh';delete l.hoaPct}
      $('lines').innerHTML=linesHtml();
    }else l[f]=val;
    odSum();
  }else if(t.dataset.p){
    pd[t.dataset.p]=val;
    if(t.dataset.p==='sourceId'){pd.newSrc=val==='__new';$('newsrc').hidden=!pd.newSrc;if(pd.newSrc)$('b-sn').focus()}
  }else if(t.dataset.s){
    sd[t.dataset.s]=t.dataset.s==='hoaPct'?Math.min(100,Math.max(0,Number(t.value)||0)):val;
    if(t.dataset.s==='group')$('pct').hidden=val!=='combo';
  }else if(t.dataset.n){nd[t.dataset.n]=val}
});

function wrapDb(fs){
  const guard=p=>Promise.race([p,new Promise((_,no)=>setTimeout(()=>no({code:'timeout'}),15000))]);
  const wrapSnap=s=>({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()})),metadata:s.metadata});
  const ref=r=>({id:r.id,set:d=>guard(r.set(d)),update:d=>guard(r.set(d,{merge:true})),delete:()=>guard(r.delete())});
  const col=c=>({
    doc:id=>ref(id?c.doc(id):c.doc()),
    get:()=>guard(c.get()).then(wrapSnap),
    onSnapshot:(next,err)=>c.onSnapshot({includeMetadataChanges:true},s=>next(wrapSnap(s)),err)
  });
  return{collection:p=>col(fs.collection(p))};
}
function showMsg(html){$('tabs').hidden=true;$('view').innerHTML=html}
function showLogin(auth,err){
  setSync('off','Chưa đăng nhập');$('who').hidden=true;
  showMsg(`<div class="login"><h1>Đăng nhập để mở sổ</h1><p class="muted">Dùng đúng tài khoản Google đã được cấp quyền.</p>
    <button class="btn primary" id="signin">Đăng nhập bằng Google</button>
    ${err?`<p class="err">${esc(err)}</p>`:''}<p class="small muted">Nếu mở link từ Zalo hoặc Facebook mà không đăng nhập được, hãy mở bằng Chrome hoặc Safari.</p></div>`);
  $('signin').onclick=async()=>{
    const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
    try{await auth.signInWithPopup(p)}
    catch(e){
      if(e?.code==='auth/popup-blocked'){auth.signInWithRedirect(p);return}
      if(e?.code==='auth/popup-closed-by-user'||e?.code==='auth/cancelled-popup-request')return;
      showLogin(auth,'Chưa đăng nhập được. Hãy thử lại bằng Chrome hoặc Safari.');
    }
  };
}
function showDenied(auth,email){
  setSync('off','Không có quyền');
  showMsg(`<div class="login"><h1>Tài khoản chưa được cấp quyền</h1><p class="muted">${esc(email)} không nằm trong danh sách được mở sổ này.</p><button class="btn" id="out">Đổi tài khoản</button></div>`);
  $('out').onclick=()=>auth.signOut();
}
let started=false;
async function start(fs,auth,u){
  setSync('busy','Đang tải…');
  let first;
  try{first=await fs.collection('products').limit(1).get({source:'server'})}
  catch(e){
    if(e?.code==='permission-denied')return showDenied(auth,u.email);
    setSync('off','Chưa kết nối được');showMsg('<div class="empty">Chưa kết nối được với sổ. Hãy kiểm tra mạng rồi tải lại trang.</div>');return;
  }
  if(first.empty){
    const b=fs.batch();
    for(const[c,id,d]of SEED)b.set(fs.collection(c).doc(id),d);
    try{await b.commit()}catch(e){toast(dbFail(e))}
  }
  if(started)return;started=true;
  uid=u.uid;db=wrapDb(fs);
  dl={save:async({filename,data})=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/csv;charset=utf-8'}));a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);return{status:'saved'}}};
  $('tabs').hidden=false;
  $('who').hidden=false;$('who').innerHTML='<button id="out">Đăng xuất</button>';
  $('out').onclick=()=>{auth.signOut().then(()=>location.reload())};
  const cat=(k,flag)=>db.collection(k).onSnapshot(s=>{
    P[k]=Object.fromEntries(s.docs.map(x=>[x.id,x.data()]));
    if(!s.metadata.fromCache)flag();noteLoaded();schedule();
  },()=>setSync('off','Mất kết nối, hãy tải lại trang'));
  let a=false,b=false;const both=()=>{if(a&&b)catalogReady=true};
  cat('products',()=>{a=true;both()});cat('sources',()=>{b=true;both()});
  focusMonths();armLoadTimer();render();
  if(state.view==='baocao')loadYear();
}
function boot(){
  const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h))state.view=h;renderTabs();
  if(!window.firebase){setSync('off','Chưa tải được');showMsg('<div class="empty">Chưa tải được trang. Hãy kiểm tra mạng rồi tải lại.</div>');return}
  if(FIREBASE_CONFIG.apiKey==='DIEN_SAU'){setSync('off','Chưa cấu hình');showMsg('<div class="empty">Website chưa được nối với dự án Firebase.</div>');return}
  firebase.initializeApp(FIREBASE_CONFIG);
  const auth=firebase.auth(),fs=firebase.firestore();
  fs.settings({ignoreUndefinedProperties:true});
  auth.onAuthStateChanged(u=>{u?start(fs,auth,u):showLogin(auth)});
}
boot();
